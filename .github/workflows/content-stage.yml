name: Content Stage
on:
  workflow_dispatch:
    inputs:
      item:
        description: 'Content item slug'
        required: true
        type: string
      stage:
        description: 'Pipeline stage to run'
        required: true
        type: choice
        options:
          - draft
          - review
          - humanize
          - translate

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-stage-${{ inputs.item }}
  cancel-in-progress: false

jobs:
  run-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Run /content-${{ inputs.stage }} on the item at content/items/${{ inputs.item }}/
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          max_turns: 25
