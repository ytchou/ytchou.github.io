<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" role="img" aria-labelledby="a3-title a3-desc" style="max-width:100%;height:auto;color:var(--color-text)" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif"><title id="a3-title">Uber 加價畫面前後對照：倍率確認 vs. 事先報價</title><desc id="a3-desc">左邊是早期畫面，顯示 1.6x 倍率，乘客要先按「我接受較高車資」再輸入倍率才能叫車；右邊是 2016 年中起的事先報價畫面，只顯示一個總價和一行「因需求增加，車資較高」的小字，不再顯示倍率。</desc><g fill="currentColor"><text x="180" y="40" text-anchor="middle" font-size="17" font-weight="700">早期：倍率＋確認步驟</text><text x="580" y="40" text-anchor="middle" font-size="17" font-weight="700">2016 年中起：事先報價</text></g><line x1="316" y1="264" x2="436" y2="264" stroke="var(--color-border-strong)" stroke-width="2"/><path d="M436 258 L446 264 L436 270 Z" fill="var(--color-border-strong)"/><text x="381" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">2016 年中改版</text><text x="381" y="288" text-anchor="middle" font-size="12" fill="currentColor">移除倍率與確認</text><rect x="60" y="64" width="240" height="384" rx="28" fill="none" stroke="var(--color-border-strong)" stroke-width="2"/><line x1="156" y1="80" x2="204" y2="80" stroke="var(--color-border-strong)" stroke-width="3" stroke-linecap="round"/><g fill="currentColor" text-anchor="middle"><text x="180" y="124" font-size="14">需求增加，車資提高</text><text x="180" y="184" font-size="52" font-weight="800">1.6x</text><text x="180" y="212" font-size="13">車資是平常的 1.6 倍</text><text x="180" y="231" font-size="12">這個倍率下最低車資 $ ———</text><text x="180" y="248" font-size="12" font-weight="600">① 先按確認</text></g><rect x="88" y="258" width="184" height="40" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="180" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">我接受較高車資</text><text x="180" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">② 再輸入倍率</text><rect x="88" y="338" width="184" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="172" y="364" text-anchor="middle" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="currentColor">1.6</text><line x1="194" y1="348" x2="194" y2="368" stroke="currentColor" stroke-width="1.5"/><text x="180" y="414" text-anchor="middle" font-size="12" fill="currentColor">完成後才送出給司機</text><rect x="460" y="64" width="240" height="384" rx="28" fill="none" stroke="var(--color-border-strong)" stroke-width="2"/><line x1="556" y1="80" x2="604" y2="80" stroke="var(--color-border-strong)" stroke-width="3" stroke-linecap="round"/><g fill="currentColor" text-anchor="middle"><text x="580" y="124" font-size="14" font-weight="600">uberX</text><text x="580" y="164" font-size="13">事先報價（單一總價）</text><text x="580" y="212" font-size="44" font-weight="800">$ ———</text><text x="580" y="240" font-size="11">因需求增加，車資較高</text></g><line x1="516" y1="248" x2="644" y2="248" stroke="currentColor" stroke-width="1" stroke-dasharray="2,2"/><rect x="488" y="276" width="184" height="40" rx="6" fill="none" stroke="var(--color-border-strong)" stroke-width="1.5" stroke-dasharray="5,4"/><text x="580" y="301" text-anchor="middle" font-size="13" fill="currentColor">沒有倍率、沒有確認步驟</text><rect x="488" y="346" width="184" height="40" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="580" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">確認叫車</text><text x="580" y="414" text-anchor="middle" font-size="12" fill="currentColor">一鍵就叫車</text><g fill="currentColor" text-anchor="middle" font-size="14" font-weight="600"><text x="180" y="476">看得到漲了幾倍，還要確認兩次</text><text x="580" y="476">只剩總價和一行小字</text><text x="580" y="496" font-weight="400" font-size="13">看不出平常該付多少</text></g><g fill="currentColor" font-size="11"><text x="40" y="522">示意圖，非實際截圖。1.6x 與兩道確認出自前員工對某一階段的描述；美國版小字原文為</text><text x="40" y="538">“Fares are higher due to increased demand”。事先報價最早在美國 6 城、印度 5 城的 uberX 試行。</text></g></svg>
