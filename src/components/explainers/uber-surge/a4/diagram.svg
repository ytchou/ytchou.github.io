<svg viewBox="0 0 720 504" role="img" aria-labelledby="a4-title a4-desc" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:inherit;color:var(--color-text)"><title id="a4-title">固定抽成與拆開計算：兩種金流對照</title><desc id="a4-desc">上圖是固定抽成：司機收入等於車資扣掉 25% 抽成，加成讓車資變大時，Uber 那 25% 的金額也跟著變大。下圖是美國 2022 年後的拆開計算：乘客車資和司機收入各由一套演算法決定，兩者之間沒有固定比例。</desc><defs><marker id="a4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-border-strong, currentColor)"/></marker><pattern id="a4-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--color-bg, transparent)"/><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/></pattern></defs><rect x="16" y="16" width="688" height="228" rx="8" fill="none" stroke="var(--color-border, currentColor)" stroke-opacity="0.6"/><text x="36" y="48" font-size="16" font-weight="700" fill="currentColor">① 固定抽成</text><text x="36" y="70" font-size="12" fill="currentColor">台灣競爭車隊的描述（約 2019–2020 年）：司機收入 = 車資 − 25% Uber 抽成</text><text x="36" y="113" font-size="13" font-weight="600" fill="currentColor">一般時段</text><rect x="120" y="92" width="76" height="32" fill="url(#a4-hatch)" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><rect x="196" y="92" width="224" height="32" fill="currentColor" fill-opacity="0.06" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><text x="158" y="113" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">Uber 25%</text><text x="308" y="113" font-size="12" text-anchor="middle" fill="currentColor">司機收入</text><text x="36" y="161" font-size="13" font-weight="600" fill="currentColor">加成時段</text><rect x="120" y="140" width="120" height="32" fill="url(#a4-hatch)" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><rect x="240" y="140" width="360" height="32" fill="currentColor" fill-opacity="0.06" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><text x="180" y="161" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">Uber 25%</text><text x="420" y="161" font-size="12" text-anchor="middle" fill="currentColor">司機收入</text><text x="36" y="206" font-size="13" font-weight="700" fill="currentColor">比例不變：加成讓車資變大，Uber 分到的金額也跟著變大</text><text x="36" y="228" font-size="11" fill="currentColor">Uber 司機說明頁：加成期間服務費比例不變。長條長度僅為示意，不代表實際金額。</text><rect x="16" y="264" width="688" height="224" rx="8" fill="none" stroke="var(--color-border, currentColor)" stroke-opacity="0.6"/><text x="36" y="296" font-size="16" font-weight="700" fill="currentColor">② 拆開計算</text><text x="36" y="318" font-size="12" fill="currentColor">美國 Uber 與 Lyft 2022 年改制：乘客車資和司機收入由演算法分別計算</text><line x1="186" y1="380" x2="186" y2="406" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5" marker-end="url(#a4-arrow)"/><line x1="534" y1="380" x2="534" y2="406" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5" marker-end="url(#a4-arrow)"/><rect x="36" y="336" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><text x="186" y="363" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">演算法 A：決定乘客付多少</text><rect x="384" y="336" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><text x="534" y="363" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">演算法 B：決定司機拿多少</text><rect x="36" y="408" width="300" height="44" rx="6" fill="none" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><text x="186" y="435" font-size="13" text-anchor="middle" fill="currentColor">乘客付的車資</text><rect x="384" y="408" width="300" height="44" rx="6" fill="none" stroke="var(--color-border-strong, currentColor)" stroke-width="1.5"/><text x="534" y="435" font-size="13" text-anchor="middle" fill="currentColor">司機拿的收入</text><text x="360" y="439" font-size="24" font-weight="700" text-anchor="middle" fill="currentColor">≠</text><text x="360" y="476" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">兩者各自計算，沒有固定比例：乘客多付，不代表司機多拿</text></svg>
