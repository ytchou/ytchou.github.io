<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#ffffff"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263238}
    .title{font-size:44px;font-weight:700}.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:20px}.bold{font-size:24px;font-weight:700}
    .box{fill:#ffffff;stroke:#aab7bf;stroke-width:2}.fixed{fill:#f4f6f7;stroke:#94a4ae;stroke-width:2}.agent{fill:#edf7f4;stroke:#5d9185;stroke-width:2}
    .tool{fill:#f3faf7;stroke:#90bcae;stroke-width:1.6}.exec{fill:#f4f7fb;stroke:#89aee0;stroke-width:2}.muted{fill:#667680}
    .line{stroke:#87959d;stroke-width:3;fill:none}.green{stroke:#418c7b;stroke-width:3;fill:none}.divider{stroke:#d7dfe3;stroke-width:2}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#87959d"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#418c7b"/></marker>
  </defs>
  <text x="70" y="78" class="title">固定規則 vs. Agent：下一步怎麼決定？</text>
  <line x1="750" y1="125" x2="750" y2="770" class="divider"/>
  <text x="230" y="160" class="head">預先定義規則</text>
  <text x="805" y="160" class="head" fill="#477f73">Agent + Tool Use</text>

  <rect x="170" y="210" rx="14" width="420" height="86" class="box"/>
  <text x="380" y="264" text-anchor="middle" class="body">目前資訊</text>
  <path d="M380 296 L380 340" class="line" marker-end="url(#arrow)"/>
  <rect x="160" y="350" rx="14" width="440" height="110" class="fixed"/>
  <text x="380" y="398" text-anchor="middle" class="bold">依照預先寫好的規則</text>
  <text x="380" y="430" text-anchor="middle" class="small muted">if / else、固定 branch、固定 retry</text>
  <path d="M380 460 L380 505" class="line" marker-end="url(#arrow)"/>
  <rect x="170" y="515" rx="14" width="420" height="86" class="box"/>
  <text x="380" y="568" text-anchor="middle" class="body">程式執行動作</text>
  <path d="M380 601 L380 645" class="line" marker-end="url(#arrow)"/>
  <rect x="170" y="655" rx="14" width="420" height="86" class="box"/>
  <text x="380" y="708" text-anchor="middle" class="body">取得結果</text>
  <path d="M170 698 L120 698 L120 252 L170 252" class="line" marker-end="url(#arrow)"/>
  <text x="94" y="500" class="small muted" transform="rotate(-90 94 500)">下一輪仍照既定規則</text>

  <rect x="895" y="205" rx="14" width="420" height="82" class="box"/>
  <text x="1105" y="256" text-anchor="middle" class="body">任務 + 目前 observation</text>
  <path d="M1105 287 L1105 325" class="green" marker-end="url(#arrowG)"/>
  <rect x="875" y="335" rx="14" width="460" height="100" class="agent"/>
  <text x="1105" y="378" text-anchor="middle" class="bold">模型判斷下一步</text>
  <text x="1105" y="412" text-anchor="middle" class="small muted">選擇工具與參數</text>

  <rect x="815" y="470" rx="16" width="580" height="126" fill="#fbfdfc" stroke="#b7d8ce" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="838" y="498" class="small" font-weight="700">可用工具</text>
  <rect x="835" y="515" rx="12" width="125" height="58" class="tool"/><text x="897" y="550" text-anchor="middle" class="small">靜態探查</text>
  <rect x="975" y="515" rx="12" width="125" height="58" class="tool"/><text x="1037" y="550" text-anchor="middle" class="small">瀏覽器渲染</text>
  <rect x="1115" y="515" rx="12" width="125" height="58" class="tool"/><text x="1177" y="550" text-anchor="middle" class="small">取得連結</text>
  <rect x="1255" y="515" rx="12" width="120" height="58" class="tool"/><text x="1315" y="550" text-anchor="middle" class="small">提交計畫</text>
  <path d="M1105 435 L1105 468" class="green" marker-end="url(#arrowG)"/>

  <rect x="920" y="625" rx="14" width="370" height="76" class="exec"/>
  <text x="1105" y="672" text-anchor="middle" class="body">程式驗證並執行</text>
  <path d="M1105 596 L1105 622" class="green" marker-end="url(#arrowG)"/>
  <path d="M1105 701 L1105 735" class="green" marker-end="url(#arrowG)"/>
  <rect x="920" y="745" rx="14" width="370" height="76" class="box"/>
  <text x="1105" y="777" text-anchor="middle" class="body">新的 observation</text>
  <text x="1105" y="805" text-anchor="middle" class="small muted">成為下一輪決策輸入</text>
  <path d="M1290 783 L1425 783 L1425 385 L1340 385" class="green" marker-end="url(#arrowG)"/>

  <!-- label moved into clean whitespace; no white background -->
  <text x="1370" y="315" text-anchor="middle" class="small" fill="#418c7b">根據新資訊重選</text>

  <rect x="70" y="842" rx="13" width="1360" height="42" fill="#eef7f4"/>
  <text x="750" y="872" text-anchor="middle" class="bold" fill="#356f63">差別不在能不能用工具，而是誰決定下一步</text>
</svg>