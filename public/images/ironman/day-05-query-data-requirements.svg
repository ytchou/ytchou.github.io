<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<style>
.t{font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.title{font-size:48px;font-weight:700;fill:#111827}
.query{font-size:29px;fill:#111827}
.h{font-size:31px;font-weight:700;fill:#111827}
.label{font-size:19px;font-weight:600;fill:#374151}
.row{font-size:20px;fill:#334155}
.key{font-size:20px;fill:#334155}
.val{font-size:20px;fill:#334155}
.arrow{stroke-width:2.4;fill:none}
</style>
<defs>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#38a169"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#4299e1"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#ed8936"/></marker>
</defs>

<text x="70" y="90" class="t title">一句需求，會對資料端提出哪些要求？</text>

<text x="88" y="205" class="t query">送給剛滿三十歲、</text>
<rect x="390" y="163" width="190" height="58" rx="12" fill="#eaf6ec"/>
<text x="420" y="204" class="t query">喜歡露營</text>
<text x="594" y="205" class="t query">、</text>
<rect x="625" y="163" width="300" height="58" rx="12" fill="#e9f3fd"/>
<text x="650" y="204" class="t query">偏好低彩度風格</text>
<text x="940" y="205" class="t query">的朋友，</text>
<rect x="1080" y="163" width="355" height="58" rx="12" fill="#fff1e5"/>
<text x="1105" y="204" class="t query">預算大概 NT$2,000</text>
<text x="1446" y="205" class="t query">。</text>

<path d="M485 225 C460 280 400 300 345 340" class="arrow" stroke="#38a169" marker-end="url(#g)"/>
<path d="M775 225 L775 335" class="arrow" stroke="#4299e1" marker-end="url(#b)"/>
<path d="M1258 225 C1270 280 1280 300 1300 340" class="arrow" stroke="#ed8936" marker-end="url(#o)"/>

<line x1="535" y1="350" x2="535" y2="830" stroke="#e5e7eb" stroke-width="1.5"/>
<line x1="1065" y1="350" x2="1065" y2="830" stroke="#e5e7eb" stroke-width="1.5"/>

<text x="80" y="390" class="t h">分類 / 使用情境</text>
<text x="80" y="432" class="t label">需要能描述產品是什麼、適合什麼情境</text>
<rect x="60" y="475" width="430" height="305" rx="18" fill="#f7fbf8" stroke="#8fd1a5" stroke-width="2"/>
<rect x="82" y="500" width="386" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="102" y="537" class="t key">category</text><text x="268" y="537" class="t row">:</text><text x="300" y="537" class="t val">outdoor</text>
<rect x="82" y="572" width="386" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="102" y="609" class="t key">subcategory</text><text x="268" y="609" class="t row">:</text><text x="300" y="609" class="t val">camping</text>
<rect x="82" y="644" width="386" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="102" y="681" class="t key">use_case</text><text x="268" y="681" class="t row">:</text><text x="300" y="681" class="t val">戶外 / 露營</text>

<text x="585" y="390" class="t h">語意與視覺線索</text>
<text x="585" y="432" class="t label">需要保留之後能判斷風格與特徵的資訊</text>
<rect x="560" y="475" width="460" height="305" rx="18" fill="#f7faff" stroke="#8bbcf4" stroke-width="2"/>
<rect x="582" y="500" width="416" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="602" y="537" class="t key">description</text><text x="790" y="537" class="t row">:</text><text x="822" y="537" class="t val">商品文字描述</text>
<rect x="582" y="572" width="416" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="602" y="609" class="t key">material</text><text x="790" y="609" class="t row">:</text><text x="822" y="609" class="t val">材質</text>
<rect x="582" y="644" width="416" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="602" y="681" class="t key">images</text><text x="790" y="681" class="t row">:</text><text x="822" y="681" class="t val">商品圖片</text>
<rect x="582" y="716" width="416" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="602" y="753" class="t key">style_signals</text><text x="790" y="753" class="t row">:</text><text x="822" y="753" class="t val">風格線索</text>

<text x="1110" y="390" class="t h">可直接篩選的數值</text>
<text x="1110" y="432" class="t label">需要能直接比較與篩選的結構化欄位</text>
<rect x="1090" y="475" width="450" height="305" rx="18" fill="#fffaf6" stroke="#f4a261" stroke-width="2"/>
<rect x="1112" y="500" width="406" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="1132" y="537" class="t key">price</text><text x="1270" y="537" class="t row">:</text><text x="1302" y="537" class="t val">1680</text>
<rect x="1112" y="572" width="406" height="58" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="1132" y="609" class="t key">currency</text><text x="1270" y="609" class="t row">:</text><text x="1302" y="609" class="t val">TWD</text>
</svg>